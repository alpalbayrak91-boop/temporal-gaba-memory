[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-gaba-memory"
version = "1.0.0"
description = "Zero-dependency 6-Layer Mathematically Verified Bi-Temporal AGM, Cellular Sheaf H^1, Causal GABA & Crowding-Optimal Multi-Agent Memory System"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alp Albayrak" }]
requires-python = ">=3.10"
keywords = [
  "ai-agents",
  "agent-memory",
  "rag",
  "bitemporal-database",
  "belief-revision",
  "cellular-sheaves",
  "vendi-score",
  "negative-knowledge",
  "merkle-tree",
  "lean4",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
temporal-gaba-memory = "temporal_gaba_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["temporal_gaba_memory*"]
