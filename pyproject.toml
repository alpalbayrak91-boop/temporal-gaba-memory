[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-gaba-memory"
version = "0.1.0"
description = "Zero-dependency Temporal-Causal GABA Inhibitory Memory Gate and Corpus-Centered 3-Channel RBF Vendi Re-Ranker for autonomous AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alp Albayrak" }]
requires-python = ">=3.10"
keywords = [
  "ai-agents",
  "agent-memory",
  "rag",
  "vendi-score",
  "negative-knowledge",
  "temporal-graph",
  "lean4",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
temporal-gaba-memory = "temporal_gaba_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["temporal_gaba_memory*"]
